name: Clean Checkout Build CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  clean-checkout:
    name: Verify Clean Checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required extension sources are tracked
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            extension/src/lib/api.ts
            extension/src/lib/browser.ts
            extension/src/lib/format.ts
            extension/src/lib/models.ts
            extension/src/lib/storage.ts
          )
          for file in "${expected[@]}"; do
            test -f "$file"
            git ls-files --error-unmatch "$file" >/dev/null
            test -z "$(git check-ignore "$file" || true)"
          done

  build-extension:
    name: Build & Test Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Run extension unit tests
        working-directory: extension
        run: npm test

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked backend dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check backend

      - name: Run Pyright
        run: uv run pyright

      - name: Run pytest
        run: uv run pytest -q
