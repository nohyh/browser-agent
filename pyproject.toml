[project]
name = "browser-agent"
version = "0.1.0"
description = "FastAPI browser agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "mcp==2.0.0",
  "openai==2.52.0",
  "python-dotenv==1.2.2",
  "uvicorn==0.52.0",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "strict"
timeout = 30
timeout_method = "thread"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
default-groups = ["dev"]
